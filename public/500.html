<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Oops, da ist was schief gelaufen.</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      background-color: #F3F4F6;
      color: #1F2937;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 2rem 1rem;
    }
    .card {
      max-width: 42rem;
      margin: 4rem auto;
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 1rem;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: #2C2C2C;
      margin: 0 0 1.5rem 0;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .btn-back {
      background-color: #FFD100;
      color: #2C2C2C;
      font-weight: 700;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn-more {
      background-color: #E5E7EB;
      color: #2C2C2C;
      font-weight: 500;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }
    .hidden {
      display: none;
    }
    #error-details {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #E5E7EB;
      text-align: left;
      color: #4B5563;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Oops, da ist was schief gelaufen.</h1>
    <div class="actions">
      <button type="button" class="btn-back" onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href = '/'; }">Zurück</button>
      <button type="button" class="btn-more" onclick="document.getElementById('error-details').classList.toggle('hidden')">Mehr Informationen</button>
    </div>
    <div id="error-details" class="hidden">
      <p>Ein unerwarteter Serverfehler (500) ist aufgetreten.</p>
    </div>
  </div>
</body>
</html>
